<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTS Service Manager</title>
<meta name="description" content="Health Tecch Solutions — Carestream service and LISAMED sales">
<meta name="theme-color" content="#08204E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HTS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<style>
  :root{--navy:#08204E;--teal:#0B6F73;--mint:#54E8AA}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--navy);overflow:hidden;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s}
  #app.ready{opacity:1}
  .splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:24px;
    background:linear-gradient(180deg,rgba(6,20,52,.35),rgba(6,20,52,.15) 45%,rgba(6,20,52,.55)),url(img/bg.jpg) center/cover no-repeat,#08204E;transition:opacity .35s}
  .splash.hide{opacity:0;pointer-events:none}
  .logocard{background:#fff;border-radius:22px;padding:18px 22px;box-shadow:0 18px 44px rgba(0,0,0,.35)}
  .logocard img{display:block;width:min(64vw,260px);height:auto}
  .splash h1{margin:6px 0 0;font-size:21px;font-weight:700;letter-spacing:.01em}
  .splash p{margin:0;font-size:13.5px;color:rgba(255,255,255,.75)}
  .bar{width:150px;height:4px;border-radius:4px;margin-top:8px;background:linear-gradient(90deg,transparent,#fff,transparent) 0 0/50% 100% no-repeat,rgba(255,255,255,.22);animation:bar 1.1s ease-in-out infinite}
  @keyframes bar{from{background-position:-100% 0,0 0}to{background-position:200% 0,0 0}}
  .card{display:none;margin-top:6px;max-width:340px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:16px;font-size:14px;line-height:1.5}
  .card.show{display:block}
  .card button{margin-top:12px;height:44px;padding:0 22px;border-radius:12px;border:0;background:#fff;color:var(--navy);font-weight:700;font-size:15px}
  .foot{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.55)}
  .install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;display:none;align-items:center;gap:12px;background:#fff;color:#0F172A;border-radius:16px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
  .install.show{display:flex}
  .install img{width:42px;height:42px;border-radius:10px}
  .install div{flex:1;font-size:13px;line-height:1.35}
  .install b{display:block;font-size:14.5px}
  .install button{border:0;border-radius:10px;height:38px;padding:0 14px;font-weight:700;font-size:14px}
  .install .go{background:var(--navy);color:#fff}
  .install .no{background:none;color:#64748B;padding:0 6px}
</style>
</head>
<body>
<div class="splash" id="splash">
  <span class="logocard"><img src="img/logo-full.png" alt="Health Tecch Solutions"></span>
  <div>
    <h1 id="appName">HTS Service Manager</h1>
    <p id="company">Carestream Service · LISAMED Sales</p>
  </div>
  <div class="bar" id="bar"></div>
  <div class="card" id="msg"></div>
  <div class="foot" id="foot"></div>
</div>
<iframe id="app" title="HTS Service Manager" allow="clipboard-read; clipboard-write; geolocation; camera; microphone; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

<div class="install" id="install">
  <img src="icons/icon-192.png" alt="">
  <div><b>Install the HTS app</b>Adds the HTS icon to your home screen.</div>
  <button class="no" onclick="hideInstall(true)">Later</button>
  <button class="go" onclick="doInstall()">Install</button>
</div>

<script>
(function(){
  var C = window.HTS_CONFIG || {};
  var url = String(C.appUrl || '').trim();
  var $ = function(id){ return document.getElementById(id); };
  if (C.name) { $('appName').textContent = C.name; document.title = C.name; }
  
  $('foot').textContent = 'App shell ' + (C.shellVersion || '');

  function show(html){ $('bar').style.display = 'none'; var m = $('msg'); m.innerHTML = html; m.classList.add('show'); }

  // 1. Link not set yet
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) {
    show('<b>Setup needed</b><br>Open <code>config.js</code> on GitHub and paste the Apps Script <b>/exec</b> link in <code>appUrl</code>.');
    return;
  }
  // 2. No internet
  if (navigator.onLine === false) {
    show('<b>No internet</b><br>The HTS app needs internet. Connect and try again.<br><button onclick="location.reload()">Try again</button>');
    window.addEventListener('online', function(){ location.reload(); });
    return;
  }
  // 3. Open the app
  var f = $('app'), done = false;
  function ready(){ if (done) return; done = true; f.classList.add('ready'); $('splash').classList.add('hide'); setTimeout(function(){ $('splash').style.display = 'none'; }, 400); }
  f.addEventListener('load', function(){ setTimeout(ready, 250); });
  f.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'shell=1';
  setTimeout(function(){ if (!done) show('Taking longer than usual…<br><button onclick="location.reload()">Reload</button>'); }, 20000);
  setTimeout(ready, 25000);
})();

// Install prompt (Android Chrome). Not shown when already opened from the home-screen icon.
var deferred = null;
var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferred = e;
  var later = 0; try { later = +localStorage.getItem('hts_install_later') || 0; } catch (x) {}
  if (!standalone && Date.now() - later > 3 * 86400000) document.getElementById('install').classList.add('show');
});
function doInstall(){ if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; hideInstall(false); }); }
function hideInstall(later){ document.getElementById('install').classList.remove('show'); if (later) try { localStorage.setItem('hts_install_later', String(Date.now())); } catch (x) {} }
window.addEventListener('appinstalled', function(){ hideInstall(false); });

if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
</script>
</body>
</html>
